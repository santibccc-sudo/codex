name: CodexVoice
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    watchOS: '10.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  CodexVoice:
    type: application
    platform: watchOS
    sources:
      - WatchApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.codexvoice.watchapp
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: WatchApp/Info.plist
        SWIFT_STRICT_CONCURRENCY: minimal
    scheme: {}
